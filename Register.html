<!DOCTYPE html>
<html>
<head>
    <title>Knovative Registration</title>
</head>

<body style="background:linear-gradient(to right,skyblue,lightcyan);">

<center>

<div style="
width:500px;
background-color:white;
padding:25px;
margin-top:40px;
border-radius:15px;
box-shadow:5px 5px 15px gray;">

<h1 style="color:navy;">KNOVATIVE</h1>
<h3>Student Registration Form</h3>

<form>

<table cellpadding="10">

<tr>
<td><b>Full Name</b></td>
<td><input type="text" size="25" placeholder="Enter Full Name"></td>
</tr>

<tr>
<td><b>Email ID</b></td>
<td><input type="email" size="25" placeholder="Enter Email"></td>
</tr>

<tr>
<td><b>Username</b></td>
<td><input type="text" size="25" placeholder="Choose Username"></td>
</tr>

<tr>
<td><b>Password</b></td>
<td><input type="password" size="25" placeholder="Create Password"></td>
</tr>

<tr>
<td><b>Confirm Password</b></td>
<td><input type="password" size="25" placeholder="Confirm Password"></td>
</tr>

<tr>
<td><b>Gender</b></td>
<td>
<input type="radio" name="gender"> Male
<input type="radio" name="gender"> Female
</td>
</tr>

<tr>
<td><b>Date of Birth</b></td>
<td><input type="date"></td>
</tr>

<tr>
<td><b>Mobile Number</b></td>
<td><input type="tel" placeholder="Enter Mobile Number"></td>
</tr>

<tr>
<td><b>Select Course</b></td>
<td>
<select>
<option>Python Programming</option>
<option>Web Development</option>
<option>Artificial Intelligence</option>
<option>Data Science</option>
<option>Machine Learning</option>
</select>
</td>
</tr>

<tr>
<td><b>Address</b></td>
<td>
<textarea rows="4" cols="25"></textarea>
</td>
</tr>

<tr>
<td colspan="2" align="center">

<input type="submit"
value="Register"
style="
background-color:green;
color:white;
padding:8px 20px;
border:none;">

&nbsp;&nbsp;

<input type="reset"
value="Clear"
style="
background-color:red;
color:white;
padding:8px 20px;
border:none;">

</td>
</tr>

</table>

</form>
<tr>
<td colspan="2" align="center">

<a href="Home.html">

<button type="button"
style="
background-color:navy;
color:white;
padding:8px 20px;
border:none;
border-radius:5px;">

Home

</button>

</a>

</td>
</tr>
<p>
Already have an account?
<a href="login.html">Login Here</a>
</p>

</div>

</center>

</body>
</html>
